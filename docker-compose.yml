# selfsend 是无状态服务（无数据库、无文件写入），没有需要持久化的数据，
# 因此不声明任何卷；全部配置直接写在下方 environment 中。
services:
  selfsend:
    image: ghcr.io/24works/selfsend:latest
    container_name: selfsend
    restart: unless-stopped
    environment:
      # ===== selfsend =====

      # 容器内必须监听 0.0.0.0，勿改
      SELFSEND_HOST: 0.0.0.0
      SELFSEND_PORT: "8787"
      # 日志级别: DEBUG/INFO/WARNING/ERROR
      SELFSEND_LOG_LEVEL: INFO

      # 合法 API Key，逗号分隔可配多个。用 scripts/generate_key.py 生成，
      # 填到 melody-auth 的 RESEND_API_KEY（必填）
      SELFSEND_API_KEYS: re_REPLACE_ME

      # 强制覆盖所有邮件的发件人地址（保留请求中的显示名），留空不覆盖
      SELFSEND_FORCE_FROM: ""

      # 发件人域名白名单，逗号分隔，留空不限制。强烈建议设置为你的域名
      SELFSEND_ALLOWED_FROM_DOMAINS: ""

      # 每个 API Key 每分钟最大请求数，0 表示不限制
      SELFSEND_RATE_LIMIT_PER_MINUTE: "60"
      # 单次请求最大收件人数（to + cc + bcc）
      SELFSEND_MAX_RECIPIENTS: "50"
      # 请求体大小上限（字节）
      SELFSEND_MAX_BODY_BYTES: "2097152"

      # ===== 上游 SMTP =====

      # 例如本地 postfix: localhost:25；或第三方: smtp.example.com（必填）
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      # 587 端口 STARTTLS 一般为 true；25 端口无加密时设为 false
      SMTP_STARTTLS: "true"
      # 465 端口隐式 SSL 设为 true（此时忽略 SMTP_STARTTLS）
      SMTP_SSL: "false"
      SMTP_TIMEOUT_SECONDS: "30"

    ports:
      # 只绑定宿主机回环地址，公网 HTTPS 由反代（Caddy/Nginx）终结
      - "127.0.0.1:8787:8787"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
